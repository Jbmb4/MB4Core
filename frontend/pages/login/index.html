<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a1020">
    <meta name="csrf-token" content="<%= it.csrfToken %>">
    <title>MB4NEXUS — Acesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/signin.css">
</head>
<body class="signin-page">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="grid-overlay" aria-hidden="true"></div>

    <main class="auth-shell">
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="brand-mark">
                <span class="brand-ring brand-ring-one" aria-hidden="true"></span>
                <span class="brand-ring brand-ring-two" aria-hidden="true"></span>
                <img src="/static/img/icon.jpg?v=20260815-nexus-3" alt="MB4NEXUS">
            </div>

            <div class="brand-copy">
                <h1 id="loginTitle">DTMod - MB4Nexus</h1>
            </div>

            <div id="error-message" class="alert alert-error hidden" role="alert" aria-live="polite"></div>
            <div id="success-message" class="alert alert-success hidden" role="status" aria-live="polite"></div>

            <form id="loginForm" class="login-form" novalidate>
                <div class="form-field">
                    <label for="email">Gmail</label>
                    <div class="field-shell">
                        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 21a8 8 0 0 0-16 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
                        </svg>
                        <input type="email" id="email" name="email" placeholder="Digite seu Gmail" autocomplete="email" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="password">Senha</label>
                    <div class="field-shell">
                        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
                        <button type="button" id="togglePassword" class="input-action" aria-label="Mostrar senha" aria-pressed="false">
                            <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
                                <circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
                            </svg>
                            <svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-3.1 3.8M6.1 6.8C3.8 8.6 2.5 12 2.5 12s3.5 6 9.5 6c1.3 0 2.5-.3 3.5-.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitButton" class="primary-button">
                    <span id="submitLabel">Entrar</span>
                    <span id="submitSpinner" class="spinner hidden" aria-hidden="true"></span>
                </button>
            </form>

            <div class="login-divider" aria-hidden="true"><span>ou</span></div>
            <p class="register-copy">Não tem uma conta?</p>
            <a class="register-link" href="/register">Registrar conta</a>

        </section>

    </main>

    <script src="../static/js/utils.js"></script>
    <script>
        const Elements = {
            loginForm: document.querySelector('#loginForm'),
            submitButton: document.querySelector('#submitButton'),
            submitLabel: document.querySelector('#submitLabel'),
            submitSpinner: document.querySelector('#submitSpinner'),
            password: document.querySelector('#password'),
            togglePassword: document.querySelector('#togglePassword'),
            error: document.querySelector('#error-message'),
            success: document.querySelector('#success-message'),
        };

        const showAlert = (type, message) => {
            const alert = Elements[type];
            alert.textContent = message;
            alert.classList.remove('hidden');
            window.setTimeout(() => alert.classList.add('hidden'), 5000);
        };

        if (new URLSearchParams(window.location.search).get('expired') === '1') {
            showAlert('error', 'Seu acesso expirou. Procure um administrador para renovar o prazo.');
        }

        Elements.togglePassword.addEventListener('click', () => {
            const visible = Elements.password.type === 'text';
            Elements.password.type = visible ? 'password' : 'text';
            Elements.togglePassword.setAttribute('aria-pressed', String(!visible));
            Elements.togglePassword.setAttribute('aria-label', visible ? 'Mostrar senha' : 'Ocultar senha');
            Elements.togglePassword.classList.toggle('is-visible', !visible);
        });

        Elements.loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            if (!Elements.loginForm.checkValidity()) {
                Elements.loginForm.reportValidity();
                return;
            }

            Elements.submitButton.disabled = true;
            Elements.submitLabel.textContent = 'Entrando';
            Elements.submitSpinner.classList.remove('hidden');

            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            const email = event.target.email.value;
            const password = event.target.password.value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'csrf-token': csrfToken,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const result = await response.json();

                if (result?.error) {
                    handleError(result.error);
                    return;
                }

                showAlert('success', 'Login realizado com sucesso.');
                window.setTimeout(() => { window.location.href = '/'; }, 700);
            } catch (error) {
                showAlert('error', 'Não foi possível conectar ao painel. Tente novamente.');
            } finally {
                Elements.submitButton.disabled = false;
                Elements.submitLabel.textContent = 'Entrar';
                Elements.submitSpinner.classList.add('hidden');
            }
        });

        const handleError = (message) => {
            const msg = String(message).toLowerCase();
            if (msg.includes('password') || msg.includes('user not found')) {
                showAlert('error', 'Gmail ou senha incorretos.');
            } else {
                showAlert('error', `Erro: ${message}`);
            }
        };
    </script>
</body>
</html>
