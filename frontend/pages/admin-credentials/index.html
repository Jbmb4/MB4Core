<!DOCTYPE html>
<html lang="pt-BR" translate="no" data-bs-theme="dark">
<head>
  <base href="/" target="_blank">
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>MB4Nexus - Segurança</title>
  <link rel="shortcut icon" href="/static/img/favicon.svg?v=20260815-nexus-2" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="../static/css/styles.css">
  <link rel="stylesheet" href="../static/css/bootstrap.css">
  <link rel="stylesheet" href="../static/css/sidebar.css">
  <link rel="stylesheet" href="../static/css/header.css">
  <meta name="csrf-token" content="<%= it.csrfToken %>">
</head>
<body>
  <main class="d-flex">
    <%~ include("./sidebar", it) %>
    <div class="container-fluid p-0">
      <%~ include("./header", it) %>
      <div class="content pt-1 overflow-auto">
        <div class="container-fluid d-flex w-100 align-items-center justify-content-center">
          <div class="card shadow-lg p-3 mb-5 rounded border border-0" style="width: 50rem;">
            <div class="card-body">
              <div class="d-flex align-items-center gap-2 mb-2">
                <i class="bi bi-shield-lock fs-3"></i>
                <h4 class="mb-0">Segurança do administrador</h4>
              </div>
              <p class="text-muted">Altere o Gmail usado no login e a senha da conta administrativa. A senha atual é obrigatória para confirmar a alteração.</p>
              <form id="adminCredentialsForm">
                <div class="mb-3">
                  <label for="currentEmail" class="form-label">Gmail atual</label>
                  <input type="email" class="form-control" id="currentEmail" value="<%= it.user.email %>" readonly>
                </div>
                <div class="mb-3">
                  <label for="currentPassword" class="form-label">Senha atual</label>
                  <input type="password" class="form-control" id="currentPassword" autocomplete="current-password" required>
                </div>
                <hr>
                <div class="mb-3">
                  <label for="newEmail" class="form-label">Novo Gmail</label>
                  <input type="email" class="form-control" id="newEmail" value="<%= it.user.email %>" autocomplete="email" required>
                </div>
                <div class="mb-3">
                  <label for="newPassword" class="form-label">Nova senha</label>
                  <input type="password" class="form-control" id="newPassword" autocomplete="new-password" minlength="6" placeholder="Deixe vazio para manter a senha atual">
                </div>
                <div class="mb-4">
                  <label for="confirmPassword" class="form-label">Confirmar nova senha</label>
                  <input type="password" class="form-control" id="confirmPassword" autocomplete="new-password" minlength="6" placeholder="Repita a nova senha">
                </div>
                <button type="submit" class="btn btn-primary w-100" id="saveAdminCredentials">
                  <i class="bi bi-shield-check me-1"></i> Salvar credenciais
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../static/js/sidebar.js"></script>
  <script src="../static/js/utils.js"></script>
  <script>
    let csrfToken = getCsrfTokenHead();
    document.getElementById('adminCredentialsForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('saveAdminCredentials');
      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (password !== confirmPassword) {
        showToastError('As novas senhas não conferem.');
        return;
      }

      button.disabled = true;
      try {
        const response = await fetch('/admin/credentials', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'csrf-token': csrfToken },
          body: JSON.stringify({
            current_password: document.getElementById('currentPassword').value,
            email: document.getElementById('newEmail').value.trim(),
            password,
            confirm_password: confirmPassword,
          }),
        });
        const refreshedCsrf = getCsrfTokenRefresh(response);
        if (refreshedCsrf) csrfToken = refreshedCsrf;
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || data.error || 'Não foi possível atualizar as credenciais.');
        showToastSuccess(data.message || 'Credenciais atualizadas com sucesso!');
        document.getElementById('currentEmail').value = document.getElementById('newEmail').value.trim();
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
      } catch (error) {
        showToastError(error.message || 'Não foi possível atualizar as credenciais.');
      } finally {
        button.disabled = false;
      }
    });
  </script>
  <script src="../static/js/dark_light.js"></script>
</body>
</html>
